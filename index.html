<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075aa6">
<title>NOOR HVAC</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f4f7fa;
  color:#12233a
}
.app{
  max-width:900px;
  margin:auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  background:white
}
.head{
  padding:18px 22px;
  background:#075aa6;
  color:white;
  border-bottom:5px solid #d8232a
}
.brand{font-size:28px;font-weight:800}
.tag{font-size:13px;margin-top:3px}

.chat{
  flex:1;
  padding:20px;
  overflow:auto;
  padding-bottom:150px
}
.welcome{
  padding:20px;
  border:1px solid #dce4ec;
  border-radius:16px;
  background:#f8fafc
}
.msg{
  max-width:82%;
  padding:12px 14px;
  margin:12px 0;
  border-radius:15px;
  white-space:pre-wrap;
  line-height:1.5
}
.user{
  margin-left:auto;
  background:#075aa6;
  color:white
}
.ai{background:#eef3f7}

.actions{
  font-size:12px;
  margin-top:7px;
  opacity:.8
}
.actions button{
  border:0;
  background:transparent;
  color:inherit;
  text-decoration:underline;
  cursor:pointer;
  padding:0
}
.ai p{margin:0 0 10px}
.ai p:last-child{margin-bottom:0}
.ai ul,.ai ol{margin:8px 0;padding-left:24px}
.ai li{margin:5px 0}
.ai h1,.ai h2,.ai h3{margin:10px 0 6px}
.ai code{
  background:#dde6ee;
  padding:1px 4px;
  border-radius:4px
}

.status{
  font-size:12px;
  color:#687587;
  padding:0 20px 8px
}
.composer{
  position:sticky;
  bottom:0;
  padding:12px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  gap:8px;
  align-items:end
}
textarea{
  flex:1;
  resize:none;
  min-height:48px;
  max-height:140px;
  border:1px solid #bbb;
  border-radius:14px;
  padding:13px;
  font-size:16px
}
.btn{
  border:0;
  border-radius:12px;
  padding:13px 16px;
  font-weight:700;
  background:#d8232a;
  color:white
}
.attach{
  background:#eef3f7;
  color:#075aa6
}
input[type=file]{display:none}
.clear{
  border:0;
  background:transparent;
  color:white;
  float:right;
  cursor:pointer;
  font-size:13px;
  margin-top:9px
}
</style>
</head>

<body>
<div class="app">

<header class="head">
  <button class="clear" id="clear">New Chat</button>
  <div class="brand">NOOR HVAC</div>
  <div class="tag">Technician You Can Trust</div>
</header>

<main id="chat" class="chat"></main>

<div id="status" class="status"></div>

<div class="composer">
  <label class="btn attach" for="file">Photo</label>
  <input id="file" type="file" accept="image/*">
  <textarea id="text" placeholder="Ask NOOR HVAC..."></textarea>
  <button id="send" class="btn">Send</button>
</div>

</div>

<script>
const chat=document.getElementById('chat');
const text=document.getElementById('text');
const file=document.getElementById('file');
const status=document.getElementById('status');

let imageData=null;
let history=[];

try{
  history=JSON.parse(localStorage.getItem('noor_hvac_history')||'[]');
}catch(e){
  history=[];
}

function save(){
  localStorage.setItem('noor_hvac_history',JSON.stringify(history));
}

function esc(s){
  return String(s).replace(/[&<>"']/g,ch=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[ch]));
}

function markdown(s){
  let x=esc(s).replace(/\r\n/g,'\n');

  x=x
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');

  const lines=x.split('\n');
  let out=[];
  let inList=false;

  for(const line of lines){
    const m=line.match(/^\s*[-*] (.+)$/);

    if(m){
      if(!inList){
        out.push('<ul>');
        inList=true;
      }
      out.push('<li>'+m[1]+'</li>');
      continue;
    }

    if(inList){
      out.push('</ul>');
      inList=false;
    }

    if(/^<h[1-3]>/.test(line)){
      out.push(line);
    }else if(line.trim()===''){
      out.push('');
    }else{
      out.push('<p>'+line+'</p>');
    }
  }

  if(inList) out.push('</ul>');
  return out.join('');
}

function render(){
  chat.innerHTML='';

  if(history.length===0){
    const welcome=document.createElement('div');
    welcome.className='welcome';
    welcome.innerHTML=
      '<b>NOOR HVAC Assistant</b><br><br>'+
      'Ask an HVAC/R question or upload an equipment photo.';
    chat.appendChild(welcome);
  }

  history.forEach((item,index)=>{
    const d=document.createElement('div');
    d.className='msg '+(item.role==='user'?'user':'ai');

    if(item.role==='assistant'){
      d.innerHTML=markdown(item.text);
    }else{
      const body=document.createElement('div');
      body.textContent=item.text;
      d.appendChild(body);

      const actions=document.createElement('div');
      actions.className='actions';

      const edit=document.createElement('button');
      edit.textContent='Edit';
      edit.onclick=()=>editMessage(index);

      actions.appendChild(edit);
      d.appendChild(actions);
    }

    chat.appendChild(d);
  });

  chat.scrollTop=chat.scrollHeight;
}

function editMessage(index){
  if(history[index].role!=='user') return;

  const old=history[index].text;

  history=history.slice(0,index);
  save();
  render();

  text.value=old;
  text.focus();
}

file.onchange=()=>{
  const f=file.files[0];
  if(!f) return;

  const reader=new FileReader();

  reader.onload=()=>{
    imageData=reader.result;
    status.textContent='Photo attached: '+f.name;
  };

  reader.readAsDataURL(f);
};

async function send(){
  const q=text.value.trim();

  if(!q && !imageData) return;

  const userText=q || 'Analyze this HVAC/R equipment photo.';
  const previousHistory=[...history];

  history.push({
    role:'user',
    text:userText
  });

  save();
  render();

  text.value='';
  status.textContent='Thinking...';

  const img=imageData;
  imageData=null;
  file.value='';

  try{
    const r=await fetch('/api/chat',{
      method:'POST',
      headers:{
        'Content-Type':'application/json'
      },
      body:JSON.stringify({
        message:userText,
        image:img,
        history:previousHistory
      })
    });

    const j=await r.json();

    if(!r.ok){
      throw new Error(j.error || 'Request failed');
    }

    history.push({
      role:'assistant',
      text:j.text
    });

    save();
    render();
    status.textContent='';

  }catch(e){
    status.textContent='';

    history.push({
      role:'assistant',
      text:'Error: '+e.message
    });

    save();
    render();
  }
}

document.getElementById('send').onclick=send;

text.addEventListener('keydown',e=>{
  if(e.key==='Enter' && !e.shiftKey){
    e.preventDefault();
    send();
  }
});

document.getElementById('clear').onclick=()=>{
  if(confirm('Start a new conversation?')){
    history=[];
    localStorage.removeItem('noor_hvac_history');
    render();
  }
};

render();
</script>

</body>
</html>
