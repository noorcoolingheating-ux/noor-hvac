<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075aa6">
<title>NOOR HVAC</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#fff}
button,textarea{font:inherit}
button{cursor:pointer}
.app{height:100dvh;display:flex;overflow:hidden}

/* SIDEBAR */

.sidebar{
  width:210px;
  flex:0 0 210px;
  background:#f4f6f8;
  border-right:1px solid #ddd;
  display:flex;
  flex-direction:column
}

.sidebar.hidden{
  display:none;
}

.fullBtn{
  border:0;
  background:#eef2f6;
  color:#075aa6;
  border-radius:9px;
  padding:8px 11px;
  font-weight:700;
}

.sideTop{padding:15px}
.historyTitle{padding:10px 15px 5px;font-size:12px;color:#667085;font-weight:700}
.chatList{overflow:auto;flex:1;padding:5px 8px 20px}
.chatItem{
  padding:10px;
  margin:3px 0;
  border-radius:9px;
  display:flex;
  align-items:center;
  gap:5px
}
.chatItem:hover,.chatItem.active{background:#e3e8ee}
.chatTitle{
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:14px
}
.smallBtn{
  border:0;
  background:transparent;
  color:#667085;
  padding:3px 5px;
  font-size:14px
}

/* MAIN */

.main{flex:1;min-width:0;display:flex;flex-direction:column}

.header{
  height:62px;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  padding:0 18px;
  gap:12px
}

.menu{
  display:none;
  border:0;
  background:transparent;
  font-size:24px
}

.headerText{font-weight:800;font-size:18px}
.tag{font-size:12px;color:#667085;margin-left:auto}

.messages{
  flex:1;
  overflow:auto;
  padding:25px max(18px,calc((100% - 760px)/2));
  padding-bottom:150px
}

.welcome{
  max-width:700px;
  margin:60px auto;
  text-align:center
}

.welcome h1{font-size:30px;margin-bottom:8px;color:#075aa6}
.welcome p{color:#667085;line-height:1.5}

.row{margin:18px 0}
.row.user{text-align:right}

.bubble{
  display:inline-block;
  max-width:85%;
  text-align:left;
  padding:12px 15px;
  border-radius:17px;
  line-height:1.5;
  white-space:normal;
  overflow-wrap:anywhere
}

.user .bubble{background:#075aa6;color:#fff}
.assistant .bubble{background:#f1f4f7;color:#172033}

.messageImage{
  display:block;
  max-width:320px;
  width:100%;
  height:auto;
  border-radius:12px;
  margin-bottom:8px
}

.msgActions{
  margin-top:6px;
  font-size:12px;
  opacity:.72
}

.msgActions button{
  border:0;
  background:transparent;
  color:inherit;
  padding:2px 6px;
  text-decoration:underline
}

.assistant p{margin:0 0 10px}
.assistant p:last-child{margin-bottom:0}
.assistant ul,.assistant ol{padding-left:22px;margin:8px 0}
.assistant li{margin:5px 0}

.assistant h1,
.assistant h2,
.assistant h3,
.assistant h4{
  margin:10px 0 6px
}

.assistant a{
  color:#075aa6;
  text-decoration:underline;
  overflow-wrap:anywhere
}

.assistant code{
  background:#dfe6ed;
  padding:2px 5px;
  border-radius:5px
}

.assistant pre{
  white-space:pre-wrap;
  background:#1f2937;
  color:#fff;
  padding:12px;
  border-radius:10px;
  overflow:auto
}

/* COMPOSER */

.bottom{
  position:relative;
  background:linear-gradient(transparent,#fff 20%);
  padding:20px max(12px,calc((100% - 780px)/2)) max(12px,env(safe-area-inset-bottom))
}

.status{
  font-size:12px;
  color:#667085;
  min-height:18px;
  padding:0 10px 5px
}

.preview{
  display:none;
  padding:8px 10px;
  border:1px solid #ddd;
  border-bottom:0;
  border-radius:16px 16px 0 0;
  background:#fff
}

.preview img{
  height:65px;
  max-width:100px;
  object-fit:cover;
  border-radius:8px
}

.preview button{
  border:0;
  background:transparent;
  margin-left:8px
}

.composer{
  border:1px solid #cfd5dc;
  border-radius:18px;
  display:flex;
  align-items:flex-end;
  gap:7px;
  padding:8px;
  background:#fff;
  box-shadow:0 3px 15px rgba(0,0,0,.06)
}

textarea{
  flex:1;
  border:0;
  outline:0;
  resize:none;
  min-height:44px;
  max-height:150px;
  padding:11px 7px;
  font-size:16px
}

.iconBtn{
  border:0;
  border-radius:11px;
  min-width:44px;
  height:44px;
  padding:0 10px;
  background:#eef2f6;
  color:#075aa6;
  font-weight:700
}

.send{background:#d8232a;color:#fff}
.stop{background:#333;color:#fff;display:none}
input[type=file]{display:none}

.overlay{display:none}

/* MOBILE */

@media(max-width:700px){
  .sidebar{
    position:fixed;
    z-index:30;
    left:-290px;
    top:0;
    bottom:0;
    transition:.2s;
    box-shadow:4px 0 20px rgba(0,0,0,.15)
  }

  .sidebar.open{left:0}

  .overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.28);
    z-index:20
  }

  .overlay.show{display:block}
  .menu{display:block}
  .tag{display:none}
  .messages{padding-left:14px;padding-right:14px}
  .bubble{max-width:92%}
}
</style>
</head>

<body>

<div class="app">

<aside id="sidebar" class="sidebar">
  <div class="sideTop">
    <div class="logo">NOOR HVAC</div>
    <button id="newChat" class="newChat">+ New Chat</button>
  </div>

  <div class="historyTitle">CONVERSATIONS</div>
  <div id="chatList" class="chatList"></div>
</aside>

<div id="overlay" class="overlay"></div>

<section class="main">

  <header class="header">
    <button id="menu" class="menu">☰</button>
    <button id="fullBtn" class="fullBtn">Full Screen</button>
    <div class="headerText">NOOR HVAC</div>
    <div class="tag">Technician You Can Trust</div>
  </header>

  <main id="messages" class="messages"></main>

  <div class="bottom">

    <div id="status" class="status"></div>

    <div id="preview" class="preview">
      <img id="previewImg">
      <button id="removePhoto">Remove photo</button>
    </div>

    <div class="composer">

      <label for="file" class="iconBtn" title="Attach photo">Photo</label>
      <input id="file" type="file" accept="image/*">

      <textarea
        id="text"
        placeholder="Message NOOR HVAC..."
        rows="1"
      ></textarea>

      <button id="stop" class="iconBtn stop">Stop</button>
      <button id="send" class="iconBtn send">Send</button>

    </div>
  </div>

</section>
</div>

<script>

const STORAGE_KEY='noor_hvac_conversations_v2';

const messagesEl=document.getElementById('messages');
const listEl=document.getElementById('chatList');
const textEl=document.getElementById('text');
const fileEl=document.getElementById('file');
const statusEl=document.getElementById('status');
const previewEl=document.getElementById('preview');
const previewImg=document.getElementById('previewImg');
const sendBtn=document.getElementById('send');
const stopBtn=document.getElementById('stop');
const sidebar=document.getElementById('sidebar');
const overlay=document.getElementById('overlay');

let conversations=[];
let activeId=null;
let imageData=null;
let controller=null;

const messageImages=new Map();

function id(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

function load(){

  try{
    conversations=JSON.parse(
      localStorage.getItem(STORAGE_KEY)||'[]'
    );

    if(!Array.isArray(conversations)){
      conversations=[];
    }

  }catch(e){
    conversations=[];
  }

  let cleaned=false;

  conversations.forEach(c=>{
    if(!Array.isArray(c.messages)) return;

    c.messages.forEach(m=>{
      if(m && typeof m.image==='string' && m.image.startsWith('data:')){
        delete m.image;
        cleaned=true;
      }
    });
  });

  if(cleaned){
    save();
  }

  try{

    const old=JSON.parse(
      localStorage.getItem('noor_hvac_history')||'[]'
    );

    if(
      Array.isArray(old) &&
      old.length &&
      !conversations.length
    ){
      conversations.push({
        id:id(),
        title:titleFrom(old),
        created:Date.now(),
        updated:Date.now(),
        messages:old
      });

      localStorage.removeItem('noor_hvac_history');
      save();
    }

  }catch(e){}

  if(conversations.length){

    conversations.sort(
      (a,b)=>(b.updated||0)-(a.updated||0)
    );

    activeId=conversations[0].id;

  }else{
    createConversation(false);
  }
}

function save(){

  const safeConversations=conversations.map(c=>({
    ...c,
    messages:Array.isArray(c.messages)
      ? c.messages.map(m=>{
          const copy={...m};
          delete copy.image;
          return copy;
        })
      : []
  }));

  try{
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(safeConversations)
    );
  }catch(e){
    console.error('Conversation save failed:',e);
  }
}

function current(){
  return conversations.find(c=>c.id===activeId);
}

function imageKey(conversationId,messageId){
  return conversationId+':'+messageId;
}

function titleFrom(msgs){

  const first=msgs.find(
    m=>m.role==='user' && m.text
  );

  if(!first){
    return 'New conversation';
  }

  let t=first.text
    .replace(/\s+/g,' ')
    .trim();

  return t.length>38
    ? t.slice(0,38)+'…'
    : t;
}

function createConversation(renderNow=true){

  const c={
    id:id(),
    title:'New conversation',
    created:Date.now(),
    updated:Date.now(),
    messages:[]
  };

  conversations.unshift(c);
  activeId=c.id;

  save();

  if(renderNow){
    renderAll();
    closeSidebar();
    textEl.focus();
  }
}

function openConversation(cid){

  activeId=cid;

  const c=current();

  if(c){
    c.updated=Date.now();
  }

  save();
  renderAll();
  closeSidebar();
}

function renameConversation(cid){

  const c=conversations.find(
    x=>x.id===cid
  );

  if(!c) return;

  const name=prompt(
    'Rename conversation:',
    c.title
  );

  if(name && name.trim()){
    c.title=name.trim();
    c.updated=Date.now();
    save();
    renderList();
  }
}

function deleteConversation(cid){

  const c=conversations.find(
    x=>x.id===cid
  );

  if(!c) return;

  if(!confirm('Delete "'+c.title+'"?')){
    return;
  }

  conversations=conversations.filter(
    x=>x.id!==cid
  );

  for(const key of messageImages.keys()){
    if(key.startsWith(cid+':')){
      messageImages.delete(key);
    }
  }

  if(!conversations.length){
    createConversation(false);
  }

  if(activeId===cid){
    activeId=conversations[0].id;
  }

  save();
  renderAll();
}

function esc(s){

  return String(s??'').replace(
    /[&<>"']/g,
    ch=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[ch])
  );
}

function markdown(s){

  let x=esc(s).replace(
    /\r\n/g,
    '\n'
  );

  const links=[];

  x=x.replace(
    /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    (match,label,url)=>{

      const token=
        'NOORLINKTOKEN'+
        links.length+
        'ENDTOKEN';

      links.push({
        label,
        url
      });

      return token;
    }
  );

  x=x
    .replace(/^#### (.+)$/gm,'<h4>$1</h4>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`\n]+)`/g,'<code>$1</code>');

  x=x.replace(
    /https?:\/\/[^\s<]+/g,
    raw=>{

      let url=raw;
      let ending='';

      while(/[.,!?;:]$/.test(url)){
        ending=url.slice(-1)+ending;
        url=url.slice(0,-1);
      }

      while(url.endsWith(')')){

        const openCount=
          (url.match(/$begin:math:text$\/g\)\|\|\[\]\)\.length\;

        const closeCount\=
          \(url\.match\(\/$end:math:text$/g)||[]).length;

        if(closeCount<=openCount){
          break;
        }

        ending=')'+ending;
        url=url.slice(0,-1);
      }

      return (
        '<a href="'+
        url+
        '" target="_blank" '+
        'rel="noopener noreferrer">'+
        url+
        '</a>'+
        ending
      );
    }
  );

  links.forEach((link,index)=>{

    const token=
      'NOORLINKTOKEN'+
      index+
      'ENDTOKEN';

    const html=
      '<a href="'+
      link.url+
      '" target="_blank" '+
      'rel="noopener noreferrer">'+
      link.label+
      '</a>';

    x=x.replace(
      token,
      html
    );
  });

  const lines=x.split('\n');

  let out=[];
  let list=false;

  for(const line of lines){

    const bullet=line.match(
      /^\s*[-*] (.+)$/
    );

    if(bullet){

      if(!list){
        out.push('<ul>');
        list=true;
      }

      out.push(
        '<li>'+bullet[1]+'</li>'
      );

      continue;
    }

    if(list){
      out.push('</ul>');
      list=false;
    }

    if(/^<h[1-4]>/.test(line)){
      out.push(line);

    }else if(line.trim()){
      out.push(
        '<p>'+line+'</p>'
      );
    }
  }

  if(list){
    out.push('</ul>');
  }

  return out.join('');
}

function renderList(){

  listEl.innerHTML='';

  const sorted=[...conversations].sort(
    (a,b)=>(b.updated||0)-(a.updated||0)
  );

  sorted.forEach(c=>{

    const row=document.createElement('div');

    row.className=
      'chatItem'+
      (c.id===activeId?' active':'');

    const title=document.createElement('div');

    title.className='chatTitle';

    title.textContent=
      c.title ||
      'New conversation';

    title.onclick=()=>{
      openConversation(c.id);
    };

    const rename=document.createElement('button');

    rename.className='smallBtn';
    rename.textContent='✎';
    rename.title='Rename';

    rename.onclick=e=>{
      e.stopPropagation();
      renameConversation(c.id);
    };

    const del=document.createElement('button');

    del.className='smallBtn';
    del.textContent='×';
    del.title='Delete';

    del.onclick=e=>{
      e.stopPropagation();
      deleteConversation(c.id);
    };

    row.append(
      title,
      rename,
      del
    );

    listEl.appendChild(row);
  });
}

function renderMessages(){

  messagesEl.innerHTML='';

  const c=current();

  if(!c) return;

  if(!c.messages.length){

    messagesEl.innerHTML=`
      <div class="welcome">
        <h1>NOOR HVAC</h1>
        <p>
          HVAC/R technical assistant.<br>
          Ask a question or attach an equipment photo.
        </p>
      </div>
    `;

    return;
  }

  c.messages.forEach((m,index)=>{

    const row=document.createElement('div');

    row.className=
      'row '+
      (m.role==='user'
        ? 'user'
        : 'assistant');

    const bubble=document.createElement('div');

    bubble.className='bubble';

    if(m.role==='assistant'){

      bubble.innerHTML=markdown(m.text);

      const actions=document.createElement('div');

      actions.className='msgActions';

      const copy=document.createElement('button');

      copy.textContent='Copy';

      copy.onclick=()=>{
        copyText(m.text);
      };

      const regen=document.createElement('button');

      regen.textContent='Regenerate';

      regen.onclick=()=>{
        regenerate(index);
      };

      actions.append(
        copy,
        regen
      );

      bubble.appendChild(actions);

    }else{

      const storedImage=
        m.id
          ? messageImages.get(
              imageKey(c.id,m.id)
            )
          : null;

      if(storedImage){

        const img=document.createElement('img');

        img.className='messageImage';
        img.src=storedImage;
        img.alt='Uploaded HVAC/R photo';

        bubble.appendChild(img);
      }

      if(m.text){

        const content=document.createElement('div');

        content.textContent=m.text;

        bubble.appendChild(content);
      }

      const actions=document.createElement('div');

      actions.className='msgActions';

      const edit=document.createElement('button');

      edit.textContent='Edit';

      edit.onclick=()=>{
        editMessage(index);
      };

      const copy=document.createElement('button');

      copy.textContent='Copy';

      copy.onclick=()=>{
        copyText(m.text);
      };

      actions.append(
        edit,
        copy
      );

      bubble.appendChild(actions);
    }

    row.appendChild(bubble);

    messagesEl.appendChild(row);
  });

  messagesEl.scrollTop=
    messagesEl.scrollHeight;
}

function renderAll(){
  renderList();
  renderMessages();
}

async function copyText(t){

  try{

    await navigator.clipboard.writeText(t);

    statusEl.textContent='Copied';

    setTimeout(()=>{
      statusEl.textContent='';
    },1000);

  }catch(e){}
}

function editMessage(index){

  const c=current();

  if(
    !c ||
    c.messages[index]?.role!=='user'
  ){
    return;
  }

  const old=c.messages[index].text;

  c.messages=
    c.messages.slice(0,index);

  c.updated=Date.now();

  save();
  renderAll();

  textEl.value=old;

  autoSize();

  textEl.focus();
}

async function regenerate(index){

  const c=current();

  if(
    !c ||
    c.messages[index]?.role!=='assistant'
  ){
    return;
  }

  let userIndex=index-1;

  while(
    userIndex>=0 &&
    c.messages[userIndex].role!=='user'
  ){
    userIndex--;
  }

  if(userIndex<0){
    return;
  }

  const userMessage=
    c.messages[userIndex];

  const userText=
    userMessage.text;

  const userImage=
    userMessage.id
      ? messageImages.get(
          imageKey(c.id,userMessage.id)
        ) || null
      : null;

  const previous=
    c.messages.slice(0,userIndex);

  c.messages=
    c.messages.slice(0,index);

  save();
  renderAll();

  await requestAI(
    userText,
    userImage,
    previous
  );
}

function autoTitle(c){

  if(c.title==='New conversation'){
    c.title=titleFrom(c.messages);
  }
}

function autoSize(){

  textEl.style.height='auto';

  textEl.style.height=
    Math.min(
      textEl.scrollHeight,
      150
    )+'px';
}

textEl.addEventListener(
  'input',
  autoSize
);

fileEl.onchange=()=>{

  const f=fileEl.files[0];

  if(!f){
    return;
  }

  if(!f.type.startsWith('image/')){

    statusEl.textContent=
      'Please choose an image.';

    fileEl.value='';

    return;
  }

  const reader=new FileReader();

  reader.onload=()=>{

    imageData=String(
      reader.result || ''
    );

    previewImg.src=imageData;

    previewEl.style.display='flex';

    previewEl.style.alignItems='center';

    statusEl.textContent=
      'Photo attached';
  };

  reader.onerror=()=>{

    imageData=null;

    fileEl.value='';

    previewImg.removeAttribute('src');

    previewEl.style.display='none';

    statusEl.textContent=
      'Could not read photo.';
  };

  reader.readAsDataURL(f);
};

document.getElementById(
  'removePhoto'
).onclick=()=>{

  imageData=null;

  fileEl.value='';

  previewImg.removeAttribute('src');

  previewEl.style.display='none';

  statusEl.textContent='';
};

async function send(){

  if(controller){
    return;
  }

  const q=textEl.value.trim();

  if(!q && !imageData){
    return;
  }

  const c=current();

  if(!c){
    return;
  }

  const userText=
    q ||
    'Analyze this HVAC/R equipment photo.';

  const previous=
    c.messages.map(m=>({
      role:m.role,
      text:m.text
    }));

  const img=imageData;

  const messageId=id();

  c.messages.push({
    id:messageId,
    role:'user',
    text:userText
  });

  if(img){
    messageImages.set(
      imageKey(c.id,messageId),
      img
    );
  }

  c.updated=Date.now();

  autoTitle(c);

  save();

  renderAll();

  textEl.value='';

  autoSize();

  imageData=null;

  fileEl.value='';

  previewImg.removeAttribute('src');

  previewEl.style.display='none';

  await requestAI(
    userText,
    img,
    previous
  );
}

async function requestAI(
  userText,
  img,
  previous
){

  controller=
    new AbortController();

  sendBtn.style.display='none';

  stopBtn.style.display='block';

  statusEl.textContent=
    'NOOR HVAC is thinking...';

  try{

    const r=await fetch(
      '/api/chat',
      {
        method:'POST',

        headers:{
          'Content-Type':
            'application/json'
        },

        signal:
          controller.signal,

        body:JSON.stringify({
          message:userText,
          image:img || null,
          history:previous
        })
      }
    );

    let j;

    try{
      j=await r.json();
    }catch(parseError){
      throw new Error(
        'Server returned an invalid response.'
      );
    }

    if(!r.ok){

      throw new Error(
        j?.error ||
        'Request failed'
      );
    }

    const c=current();

    if(!c){
      return;
    }

    c.messages.push({
      id:id(),
      role:'assistant',
      text:
        j.text ||
        'No response returned.',
      citations:
        Array.isArray(j.citations)
          ? j.citations
          : []
    });

    c.updated=Date.now();

    save();

    renderAll();

  }catch(e){

    if(e.name==='AbortError'){

      statusEl.textContent=
        'Stopped';

    }else{

      console.error(
        'NOOR HVAC request error:',
        e
      );

      statusEl.textContent=
        'Error: '+
        (
          e?.message ||
          'Request failed'
        );
    }

  }finally{

    controller=null;

    sendBtn.style.display='block';

    stopBtn.style.display='none';

    if(
      statusEl.textContent===
      'NOOR HVAC is thinking...'
    ){
      statusEl.textContent='';
    }
  }
}

stopBtn.onclick=()=>{

  if(controller){
    controller.abort();
  }
};

sendBtn.onclick=()=>{
  send();
};

textEl.addEventListener(
  'keydown',
  e=>{

    if(
      e.key==='Enter' &&
      !e.shiftKey
    ){
      e.preventDefault();
      send();
    }
  }
);

document.getElementById(
  'newChat'
).onclick=()=>{

  createConversation(true);
};

document.getElementById(
  'menu'
).onclick=()=>{

  sidebar.classList.add('open');

  overlay.classList.add('show');
};

overlay.onclick=
  closeSidebar;

function closeSidebar(){

  sidebar.classList.remove('open');

  overlay.classList.remove('show');
}

document.getElementById(
  'fullBtn'
).onclick=()=>{

  sidebar.classList.toggle(
    'hidden'
  );

  const btn=
    document.getElementById(
      'fullBtn'
    );

  if(
    sidebar.classList.contains(
      'hidden'
    )
  ){
    btn.textContent='Show History';

  }else{
    btn.textContent='Full Screen';
  }
};

load();
renderAll();

</script>

</body>
</html>
