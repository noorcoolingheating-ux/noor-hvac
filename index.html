<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075aa6"><title>NOOR HVAC</title><link rel="manifest" href="/manifest.json"><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fa;color:#12233a}.app{max-width:900px;margin:auto;min-height:100vh;display:flex;flex-direction:column;background:white}.head{padding:18px 22px;background:#075aa6;color:#fff;border-bottom:5px solid #d8232a}.brand{font-size:28px;font-weight:800}.tag{opacity:.9;font-size:13px}.chat{flex:1;padding:20px;overflow:auto}.welcome{padding:20px;border:1px solid #dce4ec;border-radius:16px;background:#f8fafc}.msg{max-width:82%;padding:12px 14px;margin:12px 0;border-radius:15px;white-space:pre-wrap}.user{margin-left:auto;background:#075aa6;color:white}.ai{background:#eef3f7;white-space:normal;line-height:1.5}.ai p{margin:0 0 10px}.ai p:last-child{margin-bottom:0}.ai ul,.ai ol{margin:8px 0;padding-left:24px}.ai li{margin:5px 0}.ai h1,.ai h2,.ai h3{margin:10px 0 6px;line-height:1.25}.ai code{background:#dde6ee;padding:1px 4px;border-radius:4px}.composer{position:sticky;bottom:0;padding:12px;background:white;border-top:1px solid #ddd;display:flex;gap:8px;align-items:end}.composer textarea{flex:1;resize:none;min-height:48px;max-height:140px;border:1px solid #bbb;border-radius:14px;padding:13px;font-size:16px}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;background:#d8232a;color:#fff}.attach{background:#eef3f7;color:#075aa6}.status{font-size:12px;color:#687587;padding:0 20px 8px}input[type=file]{display:none}
</style></head><body><div class="app"><header class="head"><div class="brand">NOOR HVAC</div><div class="tag">Technician You Can Trust</div></header><main id="chat" class="chat"><div class="welcome"><b>NOOR HVAC Assistant</b><br><br>Ask an HVAC/R question or upload an equipment photo. Your OpenAI key remains on the server.</div></main><div id="status" class="status"></div><div class="composer"><label class="btn attach" for="file">Photo</label><input id="file" type="file" accept="image/*"><textarea id="text" placeholder="Ask NOOR HVAC..."></textarea><button id="send" class="btn">Send</button></div></div><script>
const chat=document.getElementById('chat'), text=document.getElementById('text'), file=document.getElementById('file'), status=document.getElementById('status');let imageData=null;
function esc(s){return s.replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function markdown(s){
  let x=esc(s).replace(/\r\n/g,'\n');
  x=x.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>');
  x=x.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
  const lines=x.split('\n'); let out=[], inList=false;
  for(const line of lines){
    const m=line.match(/^\s*[-*] (.+)$/);
    if(m){if(!inList){out.push('<ul>');inList=true}out.push('<li>'+m[1]+'</li>');continue}
    if(inList){out.push('</ul>');inList=false}
    if(/^<h[1-3]>/.test(line)) out.push(line);
    else if(line.trim()==='') out.push('');
    else out.push('<p>'+line+'</p>');
  }
  if(inList) out.push('</ul>');
  return out.join('');
}
function add(t,c){const d=document.createElement('div');d.className='msg '+c;if(c==='ai')d.innerHTML=markdown(t);else d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
file.onchange=()=>{const f=file.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{imageData=r.result;status.textContent='Photo attached: '+f.name};r.readAsDataURL(f)};
document.getElementById('send').onclick=async()=>{const q=text.value.trim();if(!q&&!imageData)return;add(q||'Analyze this equipment photo.','user');text.value='';status.textContent='Thinking…';const img=imageData;imageData=null;file.value='';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q||'Analyze this HVAC/R equipment photo.',image:img})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');add(j.text,'ai');status.textContent=''}catch(e){add('Error: '+e.message,'ai');status.textContent=''}};
text.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('send').click()}})
</script></body></html>
