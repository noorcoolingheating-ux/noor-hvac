<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075aa6">
<title>NOOR HVAC</title>

<style>
:root{
  --blue:#075aa6;
  --blue-dark:#06477f;
  --red:#d8232a;
  --text:#172033;
  --muted:#667085;
  --line:#e5e9ef;
  --shadow:0 8px 28px rgba(20,35,55,.08);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:#eef2f6
}

button,textarea{font:inherit}
button{cursor:pointer}

a{
  color:var(--blue);
  text-decoration:none
}

a:hover{text-decoration:underline}

.app{
  height:100dvh;
  display:flex;
  overflow:hidden;
  background:#fff
}

/* SIDEBAR */

.sidebar{
  width:235px;
  flex:0 0 235px;
  background:#f4f7fa;
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column
}

.sidebar.hidden{display:none}

.sideTop{
  padding:18px 14px 12px;
  border-bottom:1px solid var(--line)
}

.logo{
  font-size:20px;
  font-weight:900;
  color:var(--blue);
  margin:2px 4px 12px
}

.newChat{
  width:100%;
  border:0;
  border-radius:12px;
  background:var(--blue);
  color:#fff;
  padding:11px 12px;
  font-weight:800;
  box-shadow:0 5px 14px rgba(7,90,166,.18)
}

.historyTitle{
  padding:16px 15px 7px;
  font-size:11px;
  letter-spacing:.08em;
  color:#7a8494;
  font-weight:800
}

.chatList{
  overflow:auto;
  flex:1;
  padding:2px 8px 20px
}

.chatItem{
  padding:9px 8px 9px 10px;
  margin:3px 0;
  border-radius:11px;
  display:flex;
  align-items:center;
  gap:5px;
  border:1px solid transparent
}

.chatItem:hover{
  background:#eaf0f5
}

.chatItem.active{
  background:#fff;
  border-color:#dbe4ec;
  box-shadow:0 2px 8px rgba(20,35,55,.05)
}

.chatTitle{
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:14px;
  font-weight:600
}

.smallBtn{
  border:0;
  background:transparent;
  color:#7b8796;
  padding:4px 5px;
  border-radius:6px;
  font-size:14px
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  background:#fff
}

.header{
  height:66px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  padding:0 20px;
  gap:12px;
  background:rgba(255,255,255,.96)
}

.menu{
  display:none;
  border:0;
  background:transparent;
  font-size:24px
}

.fullBtn{
  border:1px solid #d7e0e8;
  background:#f8fafc;
  color:var(--blue);
  border-radius:10px;
  padding:8px 11px;
  font-weight:800
}

.headerText{
  font-weight:900;
  font-size:18px
}

.headerText::before{
  content:"";
  display:inline-block;
  width:8px;
  height:8px;
  margin-right:8px;
  border-radius:50%;
  background:var(--red);
  vertical-align:2px
}

.tag{
  font-size:12px;
  color:var(--muted);
  margin-left:auto;
  font-weight:600
}

/* MESSAGES */

.messages{
  flex:1;
  overflow:auto;
  padding:30px max(18px,calc((100% - 820px)/2));
  padding-bottom:160px;
  background:linear-gradient(180deg,#fbfcfd 0,#fff 120px)
}

.welcome{
  max-width:650px;
  margin:90px auto 0;
  text-align:center
}

.welcomeMark{
  width:64px;
  height:64px;
  border-radius:18px;
  margin:0 auto 18px;
  display:grid;
  place-items:center;
  background:var(--blue);
  color:#fff;
  font-size:25px;
  font-weight:900;
  box-shadow:0 12px 28px rgba(7,90,166,.2)
}

.welcome h1{
  font-size:32px;
  margin:0 0 9px
}

.welcome p{
  color:var(--muted);
  line-height:1.6;
  margin:0
}

.row{margin:20px 0}

.row.user{text-align:right}

.bubble{
  display:inline-block;
  max-width:86%;
  text-align:left;
  padding:13px 16px;
  border-radius:18px;
  line-height:1.55;
  white-space:normal;
  overflow-wrap:anywhere;
  box-shadow:0 2px 10px rgba(20,35,55,.05)
}

.user .bubble{
  background:linear-gradient(145deg,var(--blue),var(--blue-dark));
  color:#fff;
  border-bottom-right-radius:6px
}

.assistant .bubble{
  background:#f5f7f9;
  color:var(--text);
  border:1px solid #e8edf2;
  border-bottom-left-radius:6px
}

.messageImage{
  display:block;
  max-width:360px;
  width:100%;
  height:auto;
  border-radius:12px;
  margin-bottom:9px
}

.msgActions{
  margin-top:8px;
  font-size:12px;
  opacity:.72
}

.msgActions button{
  border:0;
  background:transparent;
  color:inherit;
  padding:2px 8px 2px 0;
  text-decoration:underline
}

.assistant p{
  margin:0 0 10px
}

.assistant p:last-child{
  margin-bottom:0
}

.assistant ul,
.assistant ol{
  padding-left:22px;
  margin:9px 0
}

.assistant li{
  margin:5px 0
}

.assistant h1,
.assistant h2,
.assistant h3,
.assistant h4{
  margin:13px 0 7px;
  line-height:1.25
}

.assistant h1{font-size:22px}
.assistant h2{font-size:19px}
.assistant h3{font-size:17px}
.assistant h4{font-size:15px}

.assistant code{
  background:#e3e9ef;
  padding:2px 5px;
  border-radius:5px
}

.assistant pre{
  white-space:pre-wrap;
  background:#1f2937;
  color:#fff;
  padding:12px;
  border-radius:10px;
  overflow:auto
}

/* SOURCES */

.sourceBox{
  margin-top:12px;
  padding-top:10px;
  border-top:1px solid #dfe5eb
}

.sourceTitle{
  font-size:11px;
  letter-spacing:.06em;
  text-transform:uppercase;
  font-weight:800;
  color:#778292;
  margin-bottom:7px
}

.sourceLinks{
  display:flex;
  flex-wrap:wrap;
  gap:7px
}

.sourceLink{
  display:inline-flex;
  align-items:center;
  max-width:100%;
  padding:6px 9px;
  border:1px solid #d5e0ea;
  border-radius:999px;
  background:#fff;
  color:var(--blue);
  font-size:12px;
  font-weight:700;
  text-decoration:none
}

/* COMPOSER */

.bottom{
  position:relative;
  background:linear-gradient(transparent,#fff 26%);
  padding:
    22px
    max(12px,calc((100% - 820px)/2))
    max(14px,env(safe-area-inset-bottom))
}

.status{
  font-size:12px;
  color:var(--muted);
  min-height:20px;
  padding:0 10px 6px
}

.preview{
  display:none;
  padding:9px 11px;
  border:1px solid #d8e0e8;
  border-bottom:0;
  border-radius:16px 16px 0 0;
  background:#fff
}

.preview img{
  height:68px;
  max-width:105px;
  object-fit:cover;
  border-radius:9px
}

.preview button{
  border:0;
  background:transparent;
  margin-left:9px;
  color:var(--red);
  font-weight:700
}

.composer{
  border:1px solid #cfd
