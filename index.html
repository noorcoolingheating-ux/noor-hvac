<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075aa6">
<title>NOOR HVAC</title>

<style>
:root{
  --blue:#075aa6;
  --blue-dark:#05477f;
  --blue-soft:#eaf3fb;
  --red:#d8232a;
  --text:#172033;
  --muted:#6b7280;
  --border:#e3e8ef;
  --sidebar:#f7f9fb;
  --assistant:#f3f6f9;
  --white:#fff;
  --shadow:0 8px 30px rgba(20,35,55,.08);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:#fff;
}

button,textarea{font:inherit}
button{cursor:pointer}

.app{
  height:100dvh;
  display:flex;
  overflow:hidden;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:260px;
  flex:0 0 260px;
  background:var(--sidebar);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
}

.sidebar.hidden{
  display:none;
}

.sideTop{
  padding:18px 14px 14px;
  border-bottom:1px solid var(--border);
}

.logoWrap{
  display:flex;
  align-items:center;
  gap:11px;
  padding:2px 4px 17px;
}

.logoMark{
  width:38px;
  height:38px;
  flex:0 0 38px;
  border-radius:11px;
  overflow:hidden;
  background:#fff;
  box-shadow:0 5px 14px rgba(7,90,166,.22);
}

.logoMark img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.logoText{
  min-width:0;
}

.logo{
  font-weight:900;
  color:var(--blue);
  font-size:17px;
  line-height:1.1;
  letter-spacing:.2px;
}

.logoSub{
  margin-top:3px;
  font-size:10px;
  color:var(--muted);
  font-weight:600;
}

.newChat{
  width:100%;
  height:43px;
  border:0;
  border-radius:11px;
  background:var(--blue);
  color:#fff;
  font-weight:800;
  font-size:14px;
  box-shadow:0 4px 12px rgba(7,90,166,.18);
}

.newChat:active{
  transform:scale(.985);
}

.historyTitle{
  padding:18px 16px 7px;
  font-size:10px;
  letter-spacing:.9px;
  color:#8a94a3;
  font-weight:800;
}

.chatList{
  overflow:auto;
  flex:1;
  padding:4px 8px 20px;
}

.chatItem{
  min-height:43px;
  padding:8px 8px 8px 11px;
  margin:3px 0;
  border-radius:10px;
  display:flex;
  align-items:center;
  gap:3px;
  border:1px solid transparent;
}

.chatItem:hover{
  background:#eef3f7;
}

.chatItem.active{
  background:#e8f1fa;
  border-color:#d4e4f3;
}

.chatItem.active .chatTitle{
  color:var(--blue);
  font-weight:700;
}

.chatTitle{
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:13px;
  color:#3c4655;
}

.smallBtn{
  border:0;
  background:transparent;
  color:#8b95a3;
  padding:4px 5px;
  font-size:14px;
  border-radius:6px;
}

.smallBtn:hover{
  background:rgba(0,0,0,.05);
  color:#374151;
}

/* =========================
   MAIN
========================= */

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  background:#fff;
}

.header{
  height:68px;
  flex:0 0 68px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 22px;
  gap:12px;
  background:rgba(255,255,255,.96);
}

.menu{
  display:none;
  width:40px;
  height:40px;
  border:0;
  border-radius:10px;
  background:#f3f6f9;
  color:var(--text);
  font-size:21px;
}

.fullBtn{
  border:1px solid #dce3ea;
  background:#f7f9fb;
  color:var(--blue);
  border-radius:9px;
  padding:8px 12px;
  font-size:12px;
  font-weight:800;
}

.headerIdentity{
  display:flex;
  align-items:center;
  gap:9px;
}

.statusDot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--red);
  box-shadow:0 0 0 4px rgba(216,35,42,.08);
}

.headerText{
  font-weight:900;
  font-size:17px;
  color:#172033;
}

.tag{
  font-size:11px;
  color:#7b8492;
  margin-left:auto;
  font-weight:600;
}

/* =========================
   MESSAGES
========================= */

.messages{
  flex:1;
  overflow:auto;
  padding:
    32px
    max(22px,calc((100% - 820px)/2))
    160px;
  scroll-behavior:smooth;
}

.welcome{
  max-width:610px;
  margin:90px auto 0;
  text-align:center;
}

.welcomeMark{
  width:90px;
  height:90px;
  margin:0 auto 21px;
  border-radius:22px;
  overflow:hidden;
  background:#fff;
  box-shadow:0 12px 32px rgba(7,90,166,.22);
}

.welcomeMark img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.welcome h1{
  font-size:31px;
  margin:0 0 10px;
  color:#172033;
  letter-spacing:-.6px;
}

.welcome p{
  color:#7a8492;
  line-height:1.6;
  margin:0;
  font-size:15px;
}

.welcomeLine{
  width:42px;
  height:3px;
  background:var(--red);
  border-radius:20px;
  margin:20px auto 0;
}

.row{
  margin:20px 0;
  display:flex;
}

.row.user{
  justify-content:flex-end;
}

.row.assistant{
  justify-content:flex-start;
}

.bubble{
  display:inline-block;
  max-width:82%;
  text-align:left;
  padding:13px 16px;
  border-radius:17px;
  line-height:1.55;
  white-space:normal;
  overflow-wrap:anywhere;
  font-size:15px;
}

.user .bubble{
  background:var(--blue);
  color:#fff;
  border-bottom-right-radius:5px;
  box-shadow:0 5px 14px rgba(7,90,166,.12);
}

.assistant .bubble{
  background:var(--assistant);
  color:var(--text);
  border:1px solid #e8edf2;
  border-bottom-left-radius:5px;
}

.messageImage{
  display:block;
  max-width:340px;
  width:100%;
  height:auto;
  border-radius:12px;
  margin-bottom:10px;
  border:1px solid rgba(255,255,255,.25);
}

.msgActions{
  margin-top:8px;
  padding-top:2px;
  font-size:11px;
  opacity:.67;
}

.msgActions button{
  border:0;
  background:transparent;
  color:inherit;
  padding:2px 8px 2px 0;
  margin-right:7px;
  font-size:11px;
  font-weight:700;
}

.msgActions button:hover{
  text-decoration:underline;
}

.assistant p{
  margin:0 0
